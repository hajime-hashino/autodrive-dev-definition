name: tag

# Give each version a name.
#
# **Cut after integration.** Cutting partway through a submission leaves a tag on a version that was never integrated.
#
# **Stop cutting by hand.** Up to v0.12 tags were cut by hand, and the 6 versions from v0.13 to v0.18
# were missed (AUT-229). **There was no occasion to notice forgetting.** README says "for earlier
# versions, see the git tags," and for the 6 most recent versions there was nothing to point at.
#
# The same shape as the reference implementation's `tag.yml`, but **the version lives elsewhere.** That one reads
# the `VERSION` file. This one is in the README heading.
on:
  push:
    branches: [main]

# **Allow writing only for this run.** No separate credentials are placed.
permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # **Existing tags are needed.** Without them, it would decide "not there" every time and try to cut.
          fetch-depth: 0

      - name: Tag the version
        run: |
          set -eu

          # **Read it from the README heading.** This is the only place the version lives.
          #
          # **The heading is in English since v0.19.** It used to read "**バージョン**", and when the
          # definition was translated (AUT-261) this step failed and v0.19 got no tag (AUT-266).
          version="$(grep -m1 '\*\*Version\*\*' README.md | grep -oE 'v[0-9]+\.[0-9]+')"

          # **Fail if it cannot be read.** Proceeding with an empty value would cut a tag named
          # `definition-`, and **having cut it would look like success.**
          if [ -z "${version}" ]; then
            echo "Cannot read the version from README.md. The heading's shape may have changed." >&2
            exit 1
          fi

          # **Check that it matches the top of CHANGELOG.** Cutting a tag with only one side raised
          # makes **the full text the tag points at and that version's differences disagree.**
          changelog="$(grep -m1 -oE '^## v[0-9]+\.[0-9]+' CHANGELOG.md | sed 's/^## //')"
          if [ "${version}" != "${changelog}" ]; then
            echo "The body is ${version} but the top of CHANGELOG is ${changelog}. Make them match." >&2
            exit 1
          fi

          tag="definition-${version}"

          # **If the same name exists, do nothing.** Submissions that do not change the definition do not
          # move the version, so this is not abnormal but normal.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists. Nothing to do."
            exit 0
          fi

          # **An annotated tag needs a tagger identity.** `actions/checkout` does not set a git
          # identity, so running `git tag -a` without one fails.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # **Cut it annotated.** A lightweight tag pushes the identity of the commit it points at
          # as is. **Under a setting that keeps author emails private, lightweight tags pointing at
          # old commits are rejected** (in AUT-229, 5 actually failed with GH007). With an annotated
          # tag, what is pushed is the tag's own identity.
          git tag -a "${tag}" -m "Definition ${version}"
          git push origin "${tag}"
          echo "Cut: ${tag}"
